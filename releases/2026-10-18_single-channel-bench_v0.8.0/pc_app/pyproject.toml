[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nucsignal-studio"
version = "0.8.0"
description = "智能仿核信号发生器 PC 上位机"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PySide6>=6.8,<6.11",
  "openpyxl>=3.1",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nucsignal-studio = "nucsignal_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
